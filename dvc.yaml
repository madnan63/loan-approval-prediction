stages:
  preprocess:
    cmd: python src\preprocess.py
    deps:
    - data\raw\test.csv
    - data\raw\train.csv
    - src\preprocess.py
    outs:
    - data\processed\test.csv
    - data\processed\train.csv
  train:
    cmd: python .\src\train.py
    deps:
    - .\data\processed\train.csv
    - .\src\train.py
    outs:
    - .\data\processed\validation.csv
    - .\models\model.pkl
  evaluate:
    cmd: python .\src\evaluate.py
    deps:
    - .\data\processed\validation.csv
    - .\models\model.pkl
    - .\src\evaluate.py
    metrics:
    - .\metrics\metrics.json:
        cache: false
