stages:
  preprocess:
    cmd: python src\preprocess.py
    deps:
    - data\raw\test.csv
    - data\raw\train.csv
    - src\preprocess.py
    outs:
    - data\processed\test.csv
    - data\processed\train.csv
  train:
    cmd: python .\src\train.py
    deps:
    - .\data\processed\train.csv
    - .\src\train.py
    outs:
    - .\data\processed\validation.csv
    - .\models\decision_tree.pkl
    - .\models\extra_trees.pkl
    - .\models\gradient_boosting.pkl
    - .\models\logistic_regression.pkl
    - .\models\random_forest.pkl
    params:
    - data.random_state
    - data.test_size
    - decision_tree.random_state
    - extra_trees.n_estimators
    - extra_trees.random_state
    - gradient_boosting.random_state
    - logistic_regression.max_iter
    - logistic_regression.random_state
    - random_forest.n_estimators
    - random_forest.random_state
  evaluate:
    cmd: python .\src\evaluate.py
    deps:
    - .\data\processed\validation.csv
    - .\models\decision_tree.pkl
    - .\models\extra_trees.pkl
    - .\models\gradient_boosting.pkl
    - .\models\logistic_regression.pkl
    - .\models\random_forest.pkl
    - .\src\evaluate.py
    metrics:
    - .\metrics\metrics.json:
        cache: false
